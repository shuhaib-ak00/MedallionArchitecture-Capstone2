services:
  postgres-db:
    image: postgres:15
    container_name: capstone2_postgres
    restart: always
    environment:
      POSTGRES_DB: nyc_taxi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/app/db
      - ./data:/app/data
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nyc_taxi"]
      interval: 5s
      timeout: 5s
      retries: 12

  python-app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: capstone2_python
    depends_on:
      postgres-db:
        condition: service_healthy
    tty: true
    working_dir: /app
    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: nyc_taxi
      DATA_PATH: /app/data/raw
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts

volumes:
  pgdata:
  